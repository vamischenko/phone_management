framework:
    secret: '%env(APP_SECRET)%'
    session: false
    cache:
        default_redis_provider: '%env(REDIS_URL)%'
        app: cache.adapter.redis
        pools:
            numbers.cache:
                adapter: cache.adapter.redis
                default_lifetime: 300
                tags: true

when@test:
    framework:
        test: true
        cache:
            app: cache.adapter.array
            pools:
                numbers.cache:
                    adapter: cache.adapter.array
                    default_lifetime: 300
                    tags: true
